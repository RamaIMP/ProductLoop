lse}, {"name": "purchase_date", "type": "DATE", "required": false}, {"name": "consumer_id", "type": "STRING", "required": true}], "note": "Serial number gives the batch, so the consumer never types it."}, {"name": "kb_chunks", "group": "Consumer side", "rows": [{"chunk_id": "x500_man_overview", "product_model": "X500", "source_file": "01_product_manual.md", "section": "Overview and parts", "document_type": "product_manual", "issue_types": ["general", "other_or_unclear"], "symptoms": [], "severity_applicability": ["low", "medium", "high"], "safety_critical": false, "title": "Overview and parts", "content": "The X500 is a rotary electric shaver for daily dry and wet shaving. It has a triple-blade rotary head, a lithium-ion battery and a quick-release head for cleaning. Parts: shaving head (three rotary blades on a flexible joint), head lock ring (twist-lock that secures the head to the body), USB-C charging port on the base, power button (press once to start, hold 3 seconds to power off).", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_man_led", "product_model": "X500", "source_file": "01_product_manual.md", "section": "LED indicator", "document_type": "product_manual", "issue_types": ["power_and_charging"], "symptoms": ["led_not_working"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "LED indicator", "content": "LED indicator: green means charged, amber means charging, red means low battery. The red LED comes on at about 10 minutes of shaving time remaining.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_man_fit_steps", "product_model": "X500", "source_file": "01_product_manual.md", "section": "Fitting the shaving head", "document_type": "product_manual", "issue_types": ["shaving_head_and_fitment", "noise_and_vibration"], "symptoms": ["head_loose", "head_not_fitting", "head_wobble", "blade_unit_not_seated", "rattling_sound"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Fitting the shaving head", "content": "To fit the head: (1) align the head with the motor shaft, with the notch on the head facing the front; (2) press the head down firmly until you hear a click; (3) twist the lock ring clockwise until it stops; (4) gently pull the head upward to confirm it is secured. It should not lift or wobble.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_man_fit_warning", "product_model": "X500", "source_file": "01_product_manual.md", "section": "Loose head effects", "document_type": "product_manual", "issue_types": ["shaving_head_and_fitment", "noise_and_vibration"], "symptoms": ["rattling_sound", "increased_vibration", "increased_noise", "head_wobble"], "severity_applicability": ["low", "medium", "high"], "safety_critical": false, "title": "Loose head effects", "content": "A head that is not fully locked will rattle, vibrate abnormally and produce increased noise during use. Always confirm the click before operating the shaver.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_man_cleaning", "product_model": "X500", "source_file": "01_product_manual.md", "section": "Cleaning the shaving head", "document_type": "product_manual", "issue_types": ["cleaning_and_maintenance", "noise_and_vibration", "shaving_performance"], "symptoms": ["hair_buildup", "difficult_to_clean", "increased_noise", "reduced_cutting_quality", "cleaning_question"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Cleaning the shaving head", "content": "To clean: (1) press the head-release button on the side of the body; (2) lift the head off and separate the three blade units; (3) rinse each blade unit under warm running water for 10 seconds; (4) shake off excess water and do not wipe the blades with a towel, as this blunts the cutting edges; (5) air dry completely before reassembling, at least 30 minutes; (6) refit the head and confirm the lock click before the next use.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_man_clean_freq", "product_model": "X500", "source_file": "01_product_manual.md", "section": "Cleaning frequency", "document_type": "product_manual", "issue_types": ["cleaning_and_maintenance"], "symptoms": ["cleaning_question", "hair_buildup"], "severity_applicability": ["low"], "safety_critical": false, "title": "Cleaning frequency", "content": "Clean the shaving head after every 3 to 4 uses, or sooner if you notice reduced cutting efficiency.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_man_charging", "product_model": "X500", "source_file": "01_product_manual.md", "section": "Charging", "document_type": "product_manual", "issue_types": ["power_and_charging"], "symptoms": ["not_charging", "slow_charging", "battery_drains_fast"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Charging", "content": "Use only the supplied USB-C cable and a 5V/1A charger. A full charge takes about 60 minutes and gives up to 45 minutes of shaving time. Do not use the shaver while charging. If storing for more than 2 weeks, keep at least 40% charge.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_man_storage", "product_model": "X500", "source_file": "01_product_manual.md", "section": "Storage", "document_type": "product_manual", "issue_types": ["cleaning_and_maintenance"], "symptoms": ["storage_question", "water_exposure_question"], "severity_applicability": ["low"], "safety_critical": false, "title": "Storage", "content": "Store in the supplied travel case or an open, dry place. Do not expose to temperatures above 45 C or below 0 C. Keep the shaver away from water when not in use, because prolonged water exposure degrades the seals.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_man_blades", "product_model": "X500", "source_file": "01_product_manual.md", "section": "Blade replacement", "document_type": "product_manual", "issue_types": ["cleaning_and_maintenance", "shaving_performance"], "symptoms": ["blade_replacement_due", "pulling_hair", "reduced_cutting_quality", "blade_drag"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Blade replacement", "content": "Replace blades every 12 to 18 months under daily use. Worn blades cause reduced cutting performance, more pulling and higher operating noise.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_noise_steps", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Increased operating noise: causes and steps", "document_type": "troubleshooting_guide", "issue_types": ["noise_and_vibration"], "symptoms": ["increased_noise", "rattling_sound", "grinding_sound", "squealing_sound", "buzzing_sound"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Increased operating noise: causes and steps", "content": "Most likely causes, in order: (1) shaving head not fully locked, so a loose head vibrates against the motor shaft; (2) hair and debris under the blade units, causing friction; (3) worn or damaged blade unit, as blades past service life produce grinding sounds; (4) low battery, where the motor runs at lower voltage and unevenly; (5) internal motor bearing wear, which needs service. Steps to try: (1) Press the release button, lift off the head and check for hair buildup around the blade housings. (2) Clean all three blade units under warm running water and shake dry. (3) Refit the head with the notch aligned and the lock ring clicking firmly. (4) Charge fully for 60 minutes and retest. (5) If noise persists, listen carefully: a steady hum is normal, but grinding, rattling or a high-pitched squeal after cleaning and recharging points to blade wear or internal damage.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_noise_escalate", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Increased operating noise: when to contact service", "document_type": "troubleshooting_guide", "issue_types": ["noise_and_vibration"], "symptoms": ["increased_noise", "rattling_sound", "grinding_sound", "squealing_sound", "buzzing_sound"], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Increased operating noise: when to contact service", "content": "Contact an authorised service centre if: noise continues after cleaning and a full recharge, noise comes with heat, or the sound is grinding or squealing rather than a change in hum pitch.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_vibration_steps", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Increased vibration: causes and steps", "document_type": "troubleshooting_guide", "issue_types": ["noise_and_vibration"], "symptoms": ["increased_vibration", "irregular_vibration", "head_joint_damage"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Increased vibration: causes and steps", "content": "Most likely causes, in order: (1) shaving head not fully locked, the most common cause; (2) debris under the blade units creating imbalance; (3) worn blade unit with uneven wear; (4) damaged head joint, where the flexible joint may be cracked; (5) motor imbalance, which needs service. Steps to try: (1) Power off. (2) Remove the head completely and inspect the head joint, the rubber-edged pivot on the body, for cracks or deformation. (3) Clean the blade units and the inside of the head casing. (4) Refit firmly and confirm the lock click. (5) If the joint looks cracked or flattened, do not continue using the shaver. (6) If the joint is intact and vibration continues after refitting, contact service.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_vibration_escalate", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Increased vibration: when to contact service", "document_type": "troubleshooting_guide", "issue_types": ["noise_and_vibration"], "symptoms": ["increased_vibration", "irregular_vibration", "head_joint_damage"], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Increased vibration: when to contact service", "content": "Contact an authorised service centre if: vibration is severe, the head joint is visibly damaged, or vibration comes with noise changes or heat.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_battery_steps", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Battery draining too quickly: causes and steps", "document_type": "troubleshooting_guide", "issue_types": ["power_and_charging"], "symptoms": ["battery_drains_fast", "slow_charging", "not_charging"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Battery draining too quickly: causes and steps", "content": "Most likely causes, in order: (1) aged battery, as lithium-ion batteries lose capacity after 300 to 500 charge cycles; (2) incomplete charging from a cable or charger that does not supply the correct voltage; (3) device left on accidentally; (4) storage at extreme temperature, where heat degrades capacity. Steps to try: (1) Charge fully with the original USB-C cable and a 5V/1A source; avoid laptop USB ports, which may supply only 0.5A. (2) Confirm the LED turns green during and after charging. (3) Do one full discharge and recharge: use until the red LED comes on, then charge for 60 minutes. (4) If the device has been in daily use for more than 2 years, battery degradation is expected.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_battery_escalate", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Battery draining too quickly: when to contact service", "document_type": "troubleshooting_guide", "issue_types": ["power_and_charging"], "symptoms": ["battery_drains_fast", "slow_charging", "not_charging"], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Battery draining too quickly: when to contact service", "content": "Contact an authorised service centre if: the charge lasts fewer than 20 minutes after a confirmed full charge, or the device is less than 12 months old.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_fit_steps", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Shaving head does not fit or feels loose: causes and steps", "document_type": "troubleshooting_guide", "issue_types": ["shaving_head_and_fitment"], "symptoms": ["head_loose", "head_not_fitting", "head_wobble", "blade_unit_not_seated", "lock_ring_damaged"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Shaving head does not fit or feels loose: causes and steps", "content": "Most likely causes, in order: (1) incorrect alignment, with the notch not facing the front; (2) hair debris in the head socket preventing full seating; (3) damaged lock ring, stripped or cracked so it cannot engage; (4) bent or worn motor shaft, so the head cannot seat flush. Steps to try: (1) Remove the head fully. (2) Inspect the head socket for hair, debris or foreign material and clean with a dry brush. (3) Refit with the notch facing the front, press down firmly and twist the lock ring fully clockwise. (4) Test by pulling gently upward: if the head lifts without pressing the release button, the fit is incomplete, so repeat step 3. (5) Inspect the lock ring for cracks or stripped threads.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_fit_escalate", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Shaving head does not fit or feels loose: when to contact service", "document_type": "troubleshooting_guide", "issue_types": ["shaving_head_and_fitment"], "symptoms": ["head_loose", "head_not_fitting", "head_wobble", "blade_unit_not_seated", "lock_ring_damaged"], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Shaving head does not fit or feels loose: when to contact service", "content": "Contact an authorised service centre if: the lock ring appears damaged, or the head cannot be made to click into place after thorough cleaning and several attempts. Do not use the shaver with an unsecured head.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_heat_steps", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Device overheating during use: causes and steps", "document_type": "troubleshooting_guide", "issue_types": ["heat_and_safety"], "symptoms": ["excessive_heat", "burning_smell"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Device overheating during use: causes and steps", "content": "Most likely causes, in order: (1) extended continuous use, as the device should not run for more than 10 minutes at a time; (2) motor working harder because of dirty or worn blades; (3) charging when the ambient temperature is above 40 C; (4) internal fault in the motor or circuit board. Steps to try: (1) Power off immediately and let the device cool for at least 5 minutes. (2) Do not use for more than 10 minutes in a single session. (3) Clean the blades, because dirty blades raise motor load and heat. (4) Do not charge in direct sunlight or a hot environment; do not charge above 40 C or below 5 C.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_heat_escalate", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Device overheating during use: when to contact service", "document_type": "troubleshooting_guide", "issue_types": ["heat_and_safety"], "symptoms": ["excessive_heat", "burning_smell"], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Device overheating during use: when to contact service", "content": "Contact an authorised service centre if: the device becomes hot to the touch, not just warm, within 2 to 3 minutes of use, or the heat comes with a burning smell. Stop using it and do not charge it.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_power_steps", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Device does not power on: causes and steps", "document_type": "troubleshooting_guide", "issue_types": ["power_and_charging", "heat_and_safety"], "symptoms": ["not_powering_on", "not_charging", "led_not_working", "water_ingress"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Device does not power on: causes and steps", "content": "Most likely causes, in order: (1) battery completely discharged; (2) charging cable or port fault; (3) liquid in the charging port; (4) internal fault. Steps to try: (1) Connect to a charger, wait 5 minutes and try again. (2) Try a different USB-C cable and charger. (3) Inspect the charging port for debris. If you see moisture or liquid, stop using the shaver, do not charge it and contact an authorised service centre. (4) If the LED does not light at all during charging, the charging circuit may be faulty.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_power_escalate", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Device does not power on: when to contact service", "document_type": "troubleshooting_guide", "issue_types": ["power_and_charging", "heat_and_safety"], "symptoms": ["not_powering_on", "not_charging", "led_not_working", "water_ingress"], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Device does not power on: when to contact service", "content": "Contact an authorised service centre if: the device shows no LED response after 30 minutes on a known-good charger, or there is liquid in the charging port or body.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_cutting_steps", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Reduced cutting quality or pulling: causes and steps", "document_type": "troubleshooting_guide", "issue_types": ["shaving_performance"], "symptoms": ["reduced_cutting_quality", "missed_hairs", "requires_multiple_passes", "pulling_hair", "uneven_shave", "blade_drag"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Reduced cutting quality or pulling: causes and steps", "content": "Most likely causes, in order: (1) blades past service life, to be replaced after 12 to 18 months; (2) blade units not cleaned, as hair buildup dulls cutting; (3) shaving technique, as circular motion works best with rotary shavers. Steps to try: (1) Clean all blade units thoroughly. (2) Check the blade replacement date and inspect the blade surface for dulling or uneven wear. (3) Replace blade units if they are more than 12 months old under daily use.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_trb_cutting_escalate", "product_model": "X500", "source_file": "02_troubleshooting_guide.md", "section": "Reduced cutting quality or pulling: when to contact service", "document_type": "troubleshooting_guide", "issue_types": ["shaving_performance"], "symptoms": ["reduced_cutting_quality", "missed_hairs", "requires_multiple_passes", "pulling_hair", "uneven_shave", "blade_drag"], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Reduced cutting quality or pulling: when to contact service", "content": "Contact an authorised service centre if: pulling and discomfort continue with new blades.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_saf_stop_heat", "product_model": "X500", "source_file": "03_safety_escalation.md", "section": "Stop using: burning smell, heat, sparks", "document_type": "safety_escalation", "issue_types": ["heat_and_safety"], "symptoms": ["burning_smell", "excessive_heat", "sparking"], "severity_applicability": ["high"], "safety_critical": true, "title": "Stop using: burning smell, heat, sparks", "content": "Stop using the device and contact an authorised service centre if: (1) there is a burning smell, any smell of burning plastic or electrical burning during use; (2) the device becomes hot to the touch, beyond mild warmth, within 3 minutes of starting; (3) there is any visible spark or flash near the charging port or motor housing. Do not charge the device again.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_saf_stop_damage", "product_model": "X500", "source_file": "03_safety_escalation.md", "section": "Stop using: damage and liquid", "document_type": "safety_escalation", "issue_types": ["heat_and_safety", "shaving_head_and_fitment"], "symptoms": ["visible_damage", "head_joint_damage", "exposed_component", "water_ingress", "lock_ring_damaged", "head_detached"], "severity_applicability": ["high"], "safety_critical": true, "title": "Stop using: damage and liquid", "content": "Stop using the device and contact an authorised service centre if: (1) there is visible damage such as a cracked casing, broken head joint, bent motor shaft or exposed components; (2) water or liquid has entered the charging port or the body casing seams. Do not use the device if the lock ring is cracked or the head cannot be properly secured, because an unsecured head can detach during use.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_saf_stop_sounds", "product_model": "X500", "source_file": "03_safety_escalation.md", "section": "Stop using: electrical sounds and jammed motor", "document_type": "safety_escalation", "issue_types": ["heat_and_safety", "noise_and_vibration"], "symptoms": ["electrical_crackling", "grinding_with_resistance", "buzzing_sound", "grinding_sound"], "severity_applicability": ["high"], "safety_critical": true, "title": "Stop using: electrical sounds and jammed motor", "content": "Stop using the device and contact an authorised service centre if: (1) there are unusual electrical sounds, meaning crackling, buzzing or popping that is not mechanical in nature; (2) there is a grinding noise with resistance, where the shaver struggles and grinds, because the motor may be jammed and forcing it risks further damage or injury.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_saf_no_diy", "product_model": "X500", "source_file": "03_safety_escalation.md", "section": "Do not attempt yourself", "document_type": "safety_escalation", "issue_types": ["heat_and_safety", "shaving_head_and_fitment", "general"], "symptoms": [], "severity_applicability": ["medium", "high"], "safety_critical": true, "title": "Do not attempt yourself", "content": "Do not open the casing, as there are no user-serviceable parts inside. Do not try to repair the charging port. Do not use third-party blade units that are not approved for the X500, because an incorrect fit causes vibration and noise and may damage the motor shaft. Opening the casing or using non-approved accessories voids the warranty.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_saf_use_limits", "product_model": "X500", "source_file": "03_safety_escalation.md", "section": "Safe use limits", "document_type": "safety_escalation", "issue_types": ["heat_and_safety", "power_and_charging", "cleaning_and_maintenance"], "symptoms": ["excessive_heat", "water_exposure_question", "slow_charging"], "severity_applicability": ["low", "medium", "high"], "safety_critical": true, "title": "Safe use limits", "content": "Maximum continuous use is 10 minutes; let the device cool for 5 minutes before resuming. Do not charge in temperatures above 40 C or below 5 C. Keep away from children under 12. Shower use is permitted with the head attached and the charging port sealed; do not use the shaver near open water.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_spec_sound", "product_model": "X500", "source_file": "04_operating_specs.md", "section": "Normal operating sound", "document_type": "operating_specs", "issue_types": ["noise_and_vibration"], "symptoms": ["increased_noise", "rattling_sound", "grinding_sound", "squealing_sound", "buzzing_sound"], "severity_applicability": ["low", "medium", "high"], "safety_critical": false, "title": "Normal operating sound", "content": "Normal sound is a low, steady, smooth hum at about 55 to 62 dB at 30 cm, with a consistent pitch throughout use. Any grinding, rattling, squealing or fluctuating pitch is outside the normal range.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_spec_vibration", "product_model": "X500", "source_file": "04_operating_specs.md", "section": "Normal vibration", "document_type": "operating_specs", "issue_types": ["noise_and_vibration"], "symptoms": ["increased_vibration", "irregular_vibration"], "severity_applicability": ["low", "medium", "high"], "safety_critical": false, "title": "Normal vibration", "content": "Normal vibration is slight and consistent, comparable to a mild buzz. The flexible head joint absorbs most of it. Abnormal vibration feels like sharp or irregular shaking, or makes the device difficult to hold.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_spec_temperature", "product_model": "X500", "source_file": "04_operating_specs.md", "section": "Normal temperature", "document_type": "operating_specs", "issue_types": ["heat_and_safety"], "symptoms": ["excessive_heat"], "severity_applicability": ["low", "medium", "high"], "safety_critical": false, "title": "Normal temperature", "content": "After 5 minutes of use the body should feel slightly warm, about 30 to 38 C at the surface. Anything above about 45 C at the surface is outside the normal range. The body also becomes slightly warm during charging, which is normal.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_spec_battery", "product_model": "X500", "source_file": "04_operating_specs.md", "section": "Normal battery behaviour", "document_type": "operating_specs", "issue_types": ["power_and_charging"], "symptoms": ["battery_drains_fast", "slow_charging", "not_charging"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Normal battery behaviour", "content": "A full charge gives 45 minutes of continuous shaving and takes 60 minutes from empty. Battery lifespan is 300 to 500 full charge cycles before capacity noticeably reduces. The red LED comes on at about 10 minutes remaining.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_spec_blades", "product_model": "X500", "source_file": "04_operating_specs.md", "section": "Normal blade performance", "document_type": "operating_specs", "issue_types": ["shaving_performance", "cleaning_and_maintenance"], "symptoms": ["reduced_cutting_quality", "pulling_hair", "blade_drag", "blade_replacement_due"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Normal blade performance", "content": "New blades give a clean, comfortable cut with minimal pulling. Expected blade life is 12 to 18 months under daily use. End-of-life signs are pulling, reduced closeness and more operating sound from blade drag.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_spec_head_fit", "product_model": "X500", "source_file": "04_operating_specs.md", "section": "Correct head fit", "document_type": "operating_specs", "issue_types": ["shaving_head_and_fitment"], "symptoms": ["head_loose", "head_wobble", "rattling_sound"], "severity_applicability": ["low", "medium"], "safety_critical": false, "title": "Correct head fit", "content": "A correctly fitted head has no lateral wobble and no vertical play, and rotates smoothly under power. An incorrectly fitted head gives an audible rattle, visible wobble and uneven vibration in the body.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_svc_noise", "product_model": "X500", "source_file": "05_service_guidance.md", "section": "Service for noise and vibration", "document_type": "service_guidance", "issue_types": ["noise_and_vibration"], "symptoms": ["increased_noise", "increased_vibration", "rattling_sound", "grinding_sound"], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Service for noise and vibration", "content": "For noise or vibration a technician inspects the shaving head, lock ring and motor shaft, tests the motor under load to measure speed and acoustic profile, and inspects the motor bearing. Bearing wear is the most common internal cause in devices over 18 months old. The motor assembly or blade unit is replaced as needed, and the casing is cleaned and resealed.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_svc_battery", "product_model": "X500", "source_file": "05_service_guidance.md", "section": "Service for battery and charging", "document_type": "service_guidance", "issue_types": ["power_and_charging"], "symptoms": ["battery_drains_fast", "not_charging", "slow_charging"], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Service for battery and charging", "content": "For battery issues the technician tests charge capacity, replaces the lithium-ion pack if capacity is below 70% of original, and tests the charging circuit and USB-C port.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_svc_fit", "product_model": "X500", "source_file": "05_service_guidance.md", "section": "Service for head fitting", "document_type": "service_guidance", "issue_types": ["shaving_head_and_fitment"], "symptoms": ["head_loose", "head_not_fitting", "lock_ring_damaged", "head_joint_damage"], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Service for head fitting", "content": "For head fitting issues the technician inspects the motor shaft for bending or wear, replaces a stripped or cracked lock ring, and replaces the head assembly if the joint or casing is damaged.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_svc_power", "product_model": "X500", "source_file": "05_service_guidance.md", "section": "Service for power and electrical issues", "document_type": "service_guidance", "issue_types": ["power_and_charging", "heat_and_safety"], "symptoms": ["not_powering_on", "burning_smell", "excessive_heat", "sparking", "electrical_crackling"], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Service for power and electrical issues", "content": "For power or electrical issues the technician runs a full diagnostic of the control circuit board, inspects all internal connections, and replaces components or the full unit if the fault is in the main board.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_svc_bring", "product_model": "X500", "source_file": "05_service_guidance.md", "section": "What to bring and what to say", "document_type": "service_guidance", "issue_types": ["general", "other_or_unclear"], "symptoms": ["unclear_description", "multiple_unresolved_symptoms"], "severity_applicability": ["low", "medium", "high"], "safety_critical": false, "title": "What to bring and what to say", "content": "Bring the device, the original charging cable if the issue involves charging, and proof of purchase if the device is within warranty. Say which X500 you have, what the problem is, when it happens and what you already tried.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_svc_turnaround", "product_model": "X500", "source_file": "05_service_guidance.md", "section": "Typical turnaround", "document_type": "service_guidance", "issue_types": ["general"], "symptoms": [], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Typical turnaround", "content": "Minor repairs (blade, lock ring, battery) take 2 to 5 business days. Major repairs (motor, circuit board) take 7 to 14 business days. If the unit cannot be repaired, a refurbished replacement of equivalent specification is offered.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}, {"chunk_id": "x500_svc_warranty", "product_model": "X500", "source_file": "05_service_guidance.md", "section": "Warranty repairs", "document_type": "service_guidance", "issue_types": ["general"], "symptoms": [], "severity_applicability": ["medium", "high"], "safety_critical": false, "title": "Warranty repairs", "content": "Devices within the standard 2-year warranty are repaired or replaced at no charge, provided the fault is not caused by physical damage, liquid ingress beyond rated use, or use of non-approved accessories.", "embedding": null, "embedding_model": null, "taxonomy_version": "2.0"}], "schema": [{"name": "chunk_id", "type": "STRING", "required": true}, {"name": "product_model", "type": "STRING", "required": false}, {"name": "source_file",
